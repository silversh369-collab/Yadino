
name: Yadino Code Health

on:
  pull_request:
    branches:
      - main
      - setup/release-signing

  push:
    branches:
      - "automation/**"
      - "setup/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-checks:
    name: Android Build and Code Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source safely
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate AndroidManifest XML
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('AndroidManifest XML is valid')"

      - name: Build Debug, run lint and unit tests
        run: |
          gradle --no-daemon --stacktrace assembleDebug lintDebug testDebugUnitTest

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Yadino-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
