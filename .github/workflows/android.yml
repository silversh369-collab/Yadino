
name: Build Yadino APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

       
      - name: Inspect AndroidManifest
        run: |
          echo "Manifest file:"
          nl -ba app/src/main/AndroidManifest.xml
          echo "Checking XML:"
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('XML is valid')"
 

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace --info


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yadino-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

