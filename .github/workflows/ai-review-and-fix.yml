name: Yadino - AI Code Review

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: Review code and report findings
    runs-on: ubuntu-latest

    # بررسی کدهای Pull Request خارجی با دسترسی محدود اجرا می‌شود.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # در Pull Request، کد شاخهٔ پیشنهادی بررسی می‌شود.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate Android manifest
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "::error::AndroidManifest.xml not found"
            exit 1
          fi

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("app/src/main/AndroidManifest.xml")
          print("AndroidManifest.xml is valid XML.")
          PY

      - name: Run Android build checks
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yadino-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Report review result
        if: always()
        shell: bash
        run: |
          echo "Review workflow finished."
          echo "Check the preceding steps for build or manifest errors."